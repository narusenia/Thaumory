plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(':api')) { transitive false }
    common(project(':common')) { transitive false }
    shadowBundle project(path: ':api', configuration: 'transformProductionFabric')
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

loom {
    runs {
        // Always "Dev" (an operator on the dev server), joining the local :fabric:runServer on launch.
        client {
            programArgs '--username', 'Dev', '--quickPlayMultiplayer', 'localhost'
        }
        // ./gradlew :fabric:runDatagen writes into common so every loader ships the same data.
        datagen {
            // Client, so model providers can load client classes.
            inherit client
            name = 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${project(':common').file('src/main/generated')}"
            vmArg "-Dfabric-api.datagen.modid=${rootProject.archives_name}"
            runDir 'build/datagen'
        }
    }
}
